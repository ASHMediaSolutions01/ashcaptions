[project]
name = "ash-captions"
version = "0.5.1"
description = "In-house captioning tool for Ash Media Solutions"
requires-python = ">=3.11"
dependencies = [
    # Upper bounds and the explicit ctranslate2 range track the build venv
    # (see scripts/requirements-build.txt for the exact pins): a major bump
    # of either changes the model format or the CUDA/cuDNN matrix that
    # scripts/pkgtools/gpu_matrix.py and enable_gpu.ps1 hardcode.
    "faster-whisper>=1.2.1,<2",
    "ctranslate2>=4.8.2,<5",
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    # Required by the control page's multipart upload route.
    "python-multipart>=0.0.20",
    "watchdog>=6.0.0",
    "pystray>=0.19.5",
    "pillow>=11.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-timeout>=2.4",
    "httpx>=0.27",
    "ruff>=0.16",
    # scripts/guide_screenshots.py drives a real browser to recapture the
    # guide figures. It also needs the browser itself, once per machine:
    #     python -m playwright install chromium
    "playwright>=1.48",
    # Build box only: scripts/build.py and scripts/fetch_model.py.
    "pyinstaller>=6.22,<7",
    "huggingface_hub>=1.29,<2",
]

[project.scripts]
ash-captions = "ash_captions.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# Without this, setuptools does not find the package: the code lives under
# src/, so `pip install -e .` reported success while leaving `ash_captions`
# unimportable. The test suite hid it, because pytest's `pythonpath` below
# puts src/ on the path independently of any install.
[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ash_captions = ["web/static/*", "web/static/guide/*", "web/static/vendor/jassub/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

# Linting. The selection is deliberately about correctness, not house style:
# pyflakes and pycodestyle errors, bugbear traps, blind excepts (the codebase
# already annotates the deliberate ones with `# noqa: BLE001`), bandit's
# security checks, and a complexity ceiling. Formatting rules are left out so
# the linter never argues about a diff.
[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["src/ash_captions/web/static/vendor"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "BLE", "S", "C901"]
ignore = [
    # Line length is a review question, not a build failure.
    "E501",
    # FastAPI's whole idiom is `Depends()` / `Query()` in a default argument.
    "B008",
    # `raise ValueError("plain words")` inside an except is how errors reach
    # the editor's screen; the original is logged where it matters.
    "B904",
    # This app exists to drive ffmpeg, powershell and node. Every subprocess
    # call is a fixed argument list built in code, never a shell string.
    "S603",
    "S607",
    # `assert` is the test suite's whole vocabulary, and in src/ it is only
    # ever an internal invariant for the type checker. Nothing runs under -O.
    "S101",
]

[tool.ruff.lint.mccabe]
# Today's ceiling, not an aspiration: three functions are above it and carry
# an explicit `# noqa: C901`. Nothing new should join them.
max-complexity = 15
