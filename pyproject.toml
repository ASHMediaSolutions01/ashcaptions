[project]
name = "ash-captions"
version = "0.4.2"
description = "In-house captioning tool for Ash Media Solutions"
requires-python = ">=3.11"
dependencies = [
    # Upper bounds and the explicit ctranslate2 range track the build venv
    # (see scripts/requirements-build.txt for the exact pins): a major bump
    # of either changes the model format or the CUDA/cuDNN matrix that
    # scripts/pkgtools/gpu_matrix.py and enable_gpu.ps1 hardcode.
    "faster-whisper>=1.2.1,<2",
    "ctranslate2>=4.8.2,<5",
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    # Required by the control page's multipart upload route.
    "python-multipart>=0.0.20",
    "watchdog>=6.0.0",
    "pystray>=0.19.5",
    "pillow>=11.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-timeout>=2.4",
    "httpx>=0.27",
    # Build box only: scripts/build.py and scripts/fetch_model.py.
    "pyinstaller>=6.22,<7",
    "huggingface_hub>=1.29,<2",
]

[project.scripts]
ash-captions = "ash_captions.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# Without this, setuptools does not find the package: the code lives under
# src/, so `pip install -e .` reported success while leaving `ash_captions`
# unimportable. The test suite hid it, because pytest's `pythonpath` below
# puts src/ on the path independently of any install.
[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ash_captions = ["web/static/*", "web/static/guide/*", "web/static/vendor/jassub/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
