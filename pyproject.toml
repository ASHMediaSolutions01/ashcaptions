[project]
name = "ash-captions"
version = "0.1.0"
description = "In-house captioning tool for Ash Media Solutions"
requires-python = ">=3.11"
dependencies = [
    "faster-whisper>=1.1.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "watchdog>=6.0.0",
    "pystray>=0.19.5",
    "pillow>=11.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "httpx>=0.27"]

[project.scripts]
ash-captions = "ash_captions.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
