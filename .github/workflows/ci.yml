name: CI

# Windows only, and on the Python the bundle is built with: this app ships as
# a PyInstaller bundle for Windows editors, so anything green on another
# platform would be green about the wrong thing. Tests that need ffmpeg, the
# fonts or the whisper model skip themselves here and are covered by the
# checks run against the real installed bundle before a release.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests scripts installer

      - name: Test
        run: pytest -q --timeout=300
