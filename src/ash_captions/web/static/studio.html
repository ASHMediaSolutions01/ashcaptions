<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<title>Studio - ASH Captions</title>
<!-- __VERSION__ is stamped with the running version when the page is
     served (web/app.py) so a shipped update never pairs a cached script
     with a new page. -->
<link rel="stylesheet" href="/static/theme.css?v=__VERSION__">
<link rel="stylesheet" href="/static/studio.css?v=__VERSION__">
<link rel="stylesheet" href="/static/studio_check.css?v=__VERSION__">
<link rel="stylesheet" href="/static/studio_drag.css?v=__VERSION__">
</head>
<body class="studio">

<nav class="app-nav" aria-label="Main">
  <a class="brand" href="/"><i aria-hidden="true"></i><span>ASH Captions</span></a>
  <a class="nav-link" href="/">Queue</a>
  <a class="nav-link" href="/studio/" data-nav="studio">Studio</a>
  <a class="nav-link" href="/style-editor">Styles</a>
  <a class="nav-link" href="/guide">Help</a>
  <span class="nav-spacer"></span>
  <span class="nav-status" id="nav-status"></span>
</nav>

<header class="topbar">
  <img class="job-thumb" id="job-thumb" alt="" width="64" height="36" hidden>
  <div class="title">
    <div class="video-name" id="video-name">Loading…</div>
    <div class="style-name" id="style-name"></div>
  </div>
  <div class="status-pill" id="status-pill" role="status">Loading…</div>
  <div class="topbar-actions">
    <button type="button" class="btn small" id="reveal-btn" hidden>Open folder</button>
    <button type="button" class="btn small" id="copy-btn" hidden>Copy path</button>
    <button type="button" class="btn small" id="reset-position-btn" hidden title="Put the caption back where the look places it (Escape)">Reset position</button>
    <div id="export"></div>
    <button type="button" class="btn primary" id="burn-btn" disabled>Burn this look</button>
  </div>
</header>

<main class="workspace">
  <section class="stage-column">
    <div class="stage" id="stage">
      <div class="frame" id="frame" hidden>
        <video id="video" playsinline preload="auto"></video>
        <div class="caption-drag" id="caption-drag" hidden>
          <button type="button" class="caption-handle" id="caption-handle" aria-label="Caption position" title="Drag to move the caption. Arrow keys nudge by 1%, Shift+arrow by 5%, Escape resets."></button>
        </div>
      </div>
      <div class="stage-message" id="stage-message" hidden></div>
      <div class="stage-wait" id="stage-wait" hidden>
        <img class="wait-thumb" id="wait-thumb" alt="" hidden>
        <div class="wait-text">
          <strong id="wait-title">Still captioning</strong>
          <span id="wait-stage"></span>
          <span class="hint" id="wait-elapsed"></span>
          <div class="progress-track"><div class="progress-fill live" id="wait-fill"></div></div>
        </div>
      </div>
    </div>
    <div class="controls" id="controls" hidden>
      <button type="button" class="ctl" id="play-btn" aria-label="Play"></button>
      <span class="time" id="time-label">0:00 / 0:00</span>
      <input type="range" id="seek" min="0" max="1000" value="0" step="1" aria-label="Seek">
      <button type="button" class="ctl" id="mute-btn" aria-label="Mute"></button>
    </div>
    <div class="word-toolbar" id="word-toolbar" hidden></div>
    <div class="transcript" id="transcript" aria-label="Transcript" hidden></div>
    <section class="check" id="check" aria-label="Caption check" hidden></section>
  </section>

  <aside class="looks" id="looks">
    <div class="looks-head">
      <h2>Looks</h2>
      <button type="button" class="btn small" id="compare-btn" disabled title="Flip between the last two looks you picked (C)">Compare</button>
    </div>
    <input type="search" id="looks-filter" placeholder="Filter looks" aria-label="Filter looks" autocomplete="off">
    <p class="looks-hint" id="looks-hint">Click a look, or use the arrow keys and Enter. Burn when it's right.</p>
    <div class="looks-list" id="looks-list" role="listbox" aria-label="Looks" tabindex="0"></div>
  </aside>
</main>

<script src="/static/api.js?v=__VERSION__"></script>
<script src="/static/nav.js?v=__VERSION__"></script>
<script src="/static/toast.js?v=__VERSION__"></script>
<script src="/static/vendor/jassub/jassub.umd.js?v=__VERSION__"></script>
<script src="/static/studio_poster.js?v=__VERSION__"></script>
<script src="/static/studio_player.js?v=__VERSION__"></script>
<script src="/static/studio_looks.js?v=__VERSION__"></script>
<script src="/static/studio_check.js?v=__VERSION__"></script>
<script src="/static/studio.js?v=__VERSION__"></script>
<script src="/static/studio_drag.js?v=__VERSION__"></script>
<script src="/static/studio_word.js?v=__VERSION__"></script>
<script src="/static/export.js?v=__VERSION__"></script>
</body>
</html>
